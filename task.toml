schema_version = "1.3"

[task]
name = "samge/leads-cli-spec-compliance"
authors = [{ name = "Samge0", email = "samge720@gmail.com" }]
description = "名录查询 CLI 的规格符合性修复：以 SPEC.md 为唯一基准排查并修复工具与规格的全部行为偏离（含边界语义、排序确定性等验收口径要求）。"

[agent]
timeout_sec = 1200

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 10240
gpus = 0
allow_internet = true

[verifier]
timeout_sec = 120

[metadata]
difficulty = "medium"
category = "spec-compliance"
tags = ["python", "cli", "csv", "encoding-bom", "spec-vs-implementation", "deterministic-sort"]
